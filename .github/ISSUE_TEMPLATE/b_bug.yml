name: Bug Report
description: Report a bug or Vanilla behaviour parity issue.
title: '[Bug]: '
labels:
    - bug
    - needs-triage
body:
    - type: markdown
      attributes:
          value: >-
              Only [supported Minecraft versions](https://github.com/Tuinity/Moonrise#version-support)
              are accepted; reports for other versions will be closed. Please
              [search existing issues](https://github.com/Tuinity/Moonrise/issues?q=is%3Aissue) first.
              If the problem only happens together with another mod, use the Mod Incompatibility template instead.
    - type: dropdown
      id: mc_ver
      attributes:
          label: Minecraft Version
          description: Select every version you reproduced this on.
          multiple: true
          options:
              - '26.3'
              - '26.1.2'
              - 26.4 snapshot (name it under Additional Context)
      validations:
          required: true
    - type: input
      id: moonrise_ver
      attributes:
          label: Moonrise Version(s)
          description: Use the latest Moonrise release for each Minecraft version selected, one per version.
          placeholder: e.g. 1.2.1 (26.3), 1.2.0 (26.1.2), or the jar file names
      validations:
          required: true
    - type: dropdown
      id: mod_loader
      attributes:
          label: Mod Loader
          description: When selecting 'Both', provide logs for both loaders.
          options:
              - NeoForge
              - Fabric
              - Both (NeoForge and Fabric)
      validations:
          required: true
    - type: checkboxes
      id: checks
      attributes:
          label: Checks
          options:
              - label: I can reproduce this with only Moonrise (and Fabric API on Fabric) installed.
                required: true
              - label: I am using the latest release of Moonrise for this Minecraft version.
                required: true
    - type: textarea
      id: what_happens
      attributes:
          label: What Happens
          description: Describe the expected vs. actual behaviour. For parity issues, describe what Vanilla does.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          placeholder: |
              1. Start a server with Moonrise
              2. ...
              3. Crash / wrong behaviour
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs and Crash Reports
          description: >-
              The full latest.log, and the full crash report if there is one. Don't trim
              them to the part you think is relevant. Attach the files here (drag and drop)
              or link a https://gist.github.com/ (paste sites like mclo.gs can expire). Write 'N/A'
              only if nothing is logged.
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Additional Context (optional)
