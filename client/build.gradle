plugins {
	id 'fabric-loom'
	id 'ploceus'
}

dependencies {
	loom.clientOnlyMinecraftJar()
	ploceus.clientOnlyMappings()

	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings project.ploceus.featherMappings(project.feather_build)
	exceptions project.ploceus.raven(project.raven_build) // remove this line if not using exceptions patches
	signatures project.ploceus.sparrow(project.sparrow_build) // remove this line if not using generics patches
	nests project.ploceus.nests(project.nests_build) // remove this line if not using inner class patches

	runtimeOnly(project(":").sourceSets.main.output)
	shadow(project(":"))
	compileOnly(project(":"))


	libs("ca.spottedleaf:concurrentutil:${rootProject.concurrentutil_version}") { setTransitive(false) }
	libs("ca.spottedleaf:yamlconfig:${rootProject.yamlconfig_version}") { setTransitive(false) }
	libs("org.yaml:snakeyaml:${rootProject.snakeyaml_version}")

	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	project.ploceus.dependOsl(project.osl_version, project.environment)
}

loom {
	mixin {
		useLegacyMixinAp = false
	}
	runs.configureEach {
		ideConfigGenerated true
	}
	mods {
		main {
			sourceSet("main")
			sourceSet("main", project.rootProject)
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs += project.rootProject.sourceSets.main.java.srcDirs
		}
		resources {
			srcDirs += project.rootProject.sourceSets.main.resources.srcDirs
		}
	}
}

processResources {
	def properties = [
		"version": project.version,
		"minecraft_version": minecraft_version,
		"loader_version": loader_version,
		"mod_version": mod_version,
		"environment": project.environment
	]
	inputs.properties(properties)
	filesMatching('fabric.mod.json') {
		expand properties
	}
}

tasks.shadowJar {
	archiveClassifier = "dev-all"
	destinationDirectory = layout.buildDirectory.dir("libs")
	configurations = [project.configurations.shadow]
	relocate 'ca.spottedleaf.concurrentutil', 'ca.spottedleaf.moonrise.libs.ca.spottedleaf.concurrentutil'
	relocate 'ca.spottedleaf.yamlconfig', 'ca.spottedleaf.moonrise.libs.ca.spottedleaf.yamlconfig'
	relocate 'org.yaml.snakeyaml', 'ca.spottedleaf.moonrise.libs.org.yaml.snakeyaml'
}
