name: Feature Request
description: Request a new feature.
title: '[Feature Request]: '
labels:
    - enhancement
    - needs-triage
body:
    - type: dropdown
      id: mod_loader
      attributes:
          label: Mod Loader
          description: The mod loader(s) this feature request is relevant for.
          options:
              - NeoForge
              - Fabric
              - Both (NeoForge and Fabric)
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Description
          description: >-
              Describe the feature request in detail, including alternatives
              considered.
      validations:
          required: true
