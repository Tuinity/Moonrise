name: Performance Problem
description: Report a performance problem that doesn't fall under the bug category.
title: '[Performance]: '
labels:
    - performance
    - needs-triage
body:
    - type: markdown
      attributes:
          value: >-
              Only [supported Minecraft versions](https://github.com/Tuinity/Moonrise#version-support)
              are accepted; reports for other versions will be closed. Please
              [search existing issues](https://github.com/Tuinity/Moonrise/issues?q=is%3Aissue) first.
    - type: dropdown
      id: mc_ver
      attributes:
          label: Minecraft Version
          description: Select every version you reproduced this on.
          multiple: true
          options:
              - '26.3'
              - '26.1.2'
              - 26.4 snapshot (name it under Additional Context)
      validations:
          required: true
    - type: input
      id: moonrise_ver
      attributes:
          label: Moonrise Version
          description: Use the latest Moonrise release for your Minecraft version before reporting.
          placeholder: e.g. 1.2.1, or the jar file name
      validations:
          required: true
    - type: dropdown
      id: mod_loader
      attributes:
          label: Mod Loader
          description: When selecting 'Both', it is expected you have tested both.
          options:
              - NeoForge
              - Fabric
              - Both (NeoForge and Fabric)
      validations:
          required: true
    - type: textarea
      id: profiler
      attributes:
          label: Profiler Data
          description: >-
              Link to profiler data showing the problem, from Spark or other tools. In
              case this is not applicable fill in 'N/A' (it is expected you will
              explain why below).
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Description
          description: >-
              Describe the problem, how to reproduce it, and how it compares without
              Moonrise. Include world data, videos, etc. if relevant.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs (optional)
          description: Links to relevant logs (https://gist.github.com/ or https://mclo.gs/).
