# https://fabricmc.net/develop/

[versions]
# https://maven.architectury.dev/dev/architectury/
architectury = "20.1.15"
# https://maven.shedaniel.me/me/shedaniel/cloth/
cloth = "26.1.154"
fabricLoader = "0.19.5"
leafpile = "1.2.4"
# version ids from modrinth: https://modrinth.com/mod/lithium/versions
lithiumFabric = "mc26.1.2-0.24.2-fabric"
lithiumNeoforge = "mc26.1.2-0.24.2-neoforge"
minecraft = "26.1.2"
# https://projects.neoforged.net/neoforged/neoforge
neoforge = "26.1.2.109"
# https://projects.neoforged.net/neoforged/neoform
neoform = "26.1.2-1"

[plugins]

[libraries]
mixin = "org.spongepowered:mixin:0.8.7"
mixinExtras = "io.github.llamalad7:mixinextras-common:0.5.5"

architectury = { module = "dev.architectury:architectury", version.ref = "architectury" }
architectury-fabric = { module = "dev.architectury:architectury-fabric", version.ref = "architectury" }
architectury-neoforge = { module = "dev.architectury:architectury-neoforge", version.ref = "architectury" }
lithium-fabric = { module = "maven.modrinth:lithium", version.ref = "lithiumFabric" }
lithium-neoforge = { module = "maven.modrinth:lithium", version.ref = "lithiumNeoforge" }

fabricLoader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabricLoader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabricLoader" }
fabricMinecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

leafpile-common = { module = "ca.spottedleaf.leafpile:common", version.ref = "leafpile" }
leafpile-concurrentutil = { module = "ca.spottedleaf.leafpile:concurrentutil", version.ref = "leafpile" }
leafpile-profiler = { module = "ca.spottedleaf.leafpile:profiler", version.ref = "leafpile" }
leafpile-sampler = { module = "ca.spottedleaf.leafpile:sampler", version.ref = "leafpile" }
leafpile-yamlconfig = { module = "ca.spottedleaf.leafpile:yamlconfig", version.ref = "leafpile" }

clothConfig-common = { module = "me.shedaniel.cloth:cloth-config", version.ref = "cloth" }
clothConfig-neoforge = { module = "me.shedaniel.cloth:cloth-config-neoforge", version.ref = "cloth" }
clothConfig-fabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "cloth" }
modmenu = "com.terraformersmc:modmenu:18.0.0-alpha.6"

asm = "org.ow2.asm:asm:9.10.1"
