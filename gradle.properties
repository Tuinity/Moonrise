version=0.8.0-SNAPSHOT
group=ca.spottedleaf.moonrise
archives_base_name=moonrise

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# comma separated list for modrinth/curseforge
supported_minecraft_versions=1.21.9,1.21.10

# parchment param mappings and javadoc for common/neo
neoForge.parchment.parchmentArtifact=io.papermc.parchment.data:parchment:1.21.10+build.8

# https://fabricmc.net/develop/
fabric_api_version=0.136.0+1.21.10

# set to false when modmenu/cloth is not updated for the current minecraft version
enable_gui=true

junit_version=5.11.3

# version ids from modrinth
fabric_lithium_version=iMuOZwcu
neo_lithium_version=LGakFQ7r
neo_architectury_version=baQ6rP1K
