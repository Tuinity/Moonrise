[versions]
# Loom/Ornithe version id (used for the Minecraft dependency and jar name)
minecraft = "b1.7.3"
# Fabric's normalized game version (used by fabric.mod.json dependency checks)
game-version = "1.0.0-beta.7.3"
fabric-loader = "0.20.1"
osl = "0.23.0-alpha.6"
entrypoints = "0.6.1"

feather = "2"
raven = "2"
sparrow = "2"
nests-client = "7"
nests-server = "4"

leafpile = "1.3.2"
junit = "6.1.3"

[libraries]
leafpile-concurrentutil = { module = "ca.spottedleaf.leafpile:concurrentutil", version.ref = "leafpile" }
leafpile-yamlconfig = { module = "ca.spottedleaf.leafpile:yamlconfig", version.ref = "leafpile" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
