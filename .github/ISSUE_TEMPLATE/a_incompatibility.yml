name: Mod Incompatibility
description: Report a crash or broken behaviour that only happens when Moonrise is installed alongside another mod.
title: '[Incompatibility]: '
labels:
    - mod-incompatibility
    - needs-triage
body:
    - type: markdown
      attributes:
          value: >-
              Only [supported Minecraft versions](https://github.com/Tuinity/Moonrise#version-support)
              are accepted; reports for other versions will be closed. Please
              [search existing issues](https://github.com/Tuinity/Moonrise/issues?q=is%3Aissue) for the
              mod first, and put the mod's name in the title.
    - type: input
      id: mod_name
      attributes:
          label: Conflicting Mod
          placeholder: e.g. Example Mod
      validations:
          required: true
    - type: input
      id: mod_version
      attributes:
          label: Conflicting Mod Version(s)
          description: The exact version or jar file name, one per Minecraft version selected.
          placeholder: e.g. examplemod-neoforge-1.2.3+26.3.jar, examplemod-neoforge-1.2.3+26.1.2.jar
      validations:
          required: true
    - type: input
      id: mod_link
      attributes:
          label: Conflicting Mod Link
          description: Modrinth, CurseForge, or source repository page.
          placeholder: e.g. https://modrinth.com/mod/example-mod
      validations:
          required: true
    - type: dropdown
      id: mc_ver
      attributes:
          label: Minecraft Version
          description: Select every version you reproduced this on.
          multiple: true
          options:
              - '26.3'
              - '26.1.2'
              - 26.4 snapshot (name it under Additional Context)
      validations:
          required: true
    - type: input
      id: moonrise_ver
      attributes:
          label: Moonrise Version(s)
          description: Use the latest Moonrise release for each Minecraft version selected, one per version.
          placeholder: e.g. 1.2.1 (26.3), 1.2.0 (26.1.2), or the jar file names
      validations:
          required: true
    - type: dropdown
      id: mod_loader
      attributes:
          label: Mod Loader
          description: When selecting 'Both', provide logs for both loaders.
          options:
              - NeoForge
              - Fabric
              - Both (NeoForge and Fabric)
      validations:
          required: true
    - type: checkboxes
      id: checks
      attributes:
          label: Checks
          options:
              - label: I can reproduce this with only Moonrise, the conflicting mod, and that mod's required dependencies installed.
                required: true
              - label: The problem does not happen when Moonrise is removed and nothing else is changed.
                required: true
              - label: I am using the latest release of Moonrise and of the conflicting mod for this Minecraft version.
                required: true
    - type: textarea
      id: what_happens
      attributes:
          label: What Happens
          description: e.g. crash on startup, crash when doing something in game, wrong behaviour (describe expected vs. actual).
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          placeholder: |
              1. Start a server with Moonrise and <mod>
              2. ...
              3. Crash / wrong behaviour
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs and Crash Reports
          description: >-
              The full latest.log, and the full crash report if there is one. Don't trim
              them to the part you think is relevant. Attach the files here (drag and drop)
              or link a https://gist.github.com/ (paste sites like mclo.gs can expire). Write 'N/A'
              only if nothing is logged.
      validations:
          required: true
    - type: textarea
      id: context
      attributes:
          label: Additional Context (optional)
